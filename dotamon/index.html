e gank."],linesAfter:["You DID see me. Rude. Well played."]},{id:"champ_docks",x:20,y:11,spr:"champ",name:"Riyadh Masters Docks: Marlin",range:0,movedIf:"badge_docks",alt:{x:16,y:12},trainer:{team:[["tide",25],["luna",25],["storm",26],["pa",26]],gold:700,elite:!0,badge:"badge_docks"},lines:["Riyadh Masters. Seven-figure prize pool. Four titles walk in here and drown.","You have three. Interesting. Show me you belong on the big stage."],linesAfter:["The biggest paycheck of your run so far. You earned the stage.","One title left: the Rustwater Major, in the Grand Library. Win it and TI opens."]}]},library:{name:"The Grand Library",theme:"interior",faction:"library",zone:"library",grid:["BBBBBBBBBBBBBBBBBBBB","B......BB......BBBXB","B.BBBB.BB.BBBB.BB..B","B.BBBB.BB.BBBB.....B","B..................B","B,,,.BBBB.BBBB.,,,.B","B,,,.BBBB.BBBB.,,,.B","B..................B","B.BBBB.,,,,.BBBBB..B","B.BBBB.,,,,.BBBBB..B","B..................B","X..................B","B..,,,........,,,..B","BBBBBBBBBBBBBBBBBBBB"],warps:{"0,11":{map:"docks",x:19,y:11},"18,1":{map:"basement",x:2,y:2}},npcs:[{id:"nurse_lib",x:3,y:4,spr:"nurse",name:"Archive Medic",action:"nurse",lines:["Shhh. Healing wing. No screaming when your carry gets hexed. This is a library."]},{id:"ltr1",x:10,y:7,spr:"npc",name:"Scholar Ines",range:3,trainer:{team:[["cm",23]],gold:210},lines:["Major qualifier. I have read every patch note since 6.48. Draft knowledge is mandatory."],linesAfter:["Not in the notes... this was NOT in the notes..."]},{id:"ltr2",x:14,y:10,spr:"npc",name:"Curator Vlad",range:3,trainer:{team:[["lich",24],["wd",24]],gold:400},lines:["These strats are older than your MMR. Colder, too. Winter is a playstyle."],linesAfter:["Overdue. Everything is overdue, including my retirement."]},{id:"champ_lib",x:18,y:2,spr:"champ",name:"The Rustwater Major: Morgana",range:0,movedIf:"badge_library",alt:{x:14,y:4},trainer:{team:[["lion",29,["aghs","vitality"]],["pudge",29,["vitality","platemail"]],["void",29,["broad
