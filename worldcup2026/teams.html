<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD World Cup 2026 — Teams</title>
<meta name="robots" content="noindex">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='%23ffd97a'>🏆</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root {
    --bg-dark: #081519;
    --bg-deeper: #050d10;
    --bg-panel: rgba(10, 28, 34, 0.88);
    --bg-stone: #14323a;
    --accent-gold: #ffd97a;
    --accent-gold-soft: #e8a33d;
    --accent-gold-deep: #b97c20;
    --accent-teal: #8df5ea;
    --accent-teal-dim: #2a6a66;
    --accent-cream: #f4e4bc;
    --text-main: #dceae6;
    --text-dim: #8fb0aa;
    --px: 3px;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html { background: var(--bg-dark); }
body {
    min-height: 100vh;
    font-family: 'VT323', monospace;
    font-size: 21px;
    color: var(--text-main);
    overflow-x: hidden;
}
img, video { image-rendering: pixelated; }

.bg-base {
    position: fixed; inset: 0; z-index: 0;
    background:
        linear-gradient(rgba(8,21,25,0.88), rgba(5,13,16,0.96)),
        url('assets/scene_03_arena.jpg') center / cover no-repeat;
    image-rendering: pixelated;
}
.bg-vignette {
    position: fixed; inset: 0; z-index: 0;
    background: radial-gradient(circle at 50% 40%, transparent 25%, rgba(2,8,10,0.78) 100%);
    pointer-events: none;
}
.scanlines {
    position: fixed; inset: 0; pointer-events: none; z-index: 9999;
    background: repeating-linear-gradient(0deg, rgba(0,0,0,0.16) 0 1px, transparent 1px 4px);
    mix-blend-mode: multiply;
}
.ember {
    position: fixed; width: 4px; height: 4px;
    background: var(--accent-gold);
    box-shadow: 0 0 6px rgba(255,180,70,0.8);
    opacity: 0; z-index: 1; pointer-events: none;
    animation: emberRise linear infinite;
}
.ember:nth-child(odd) { background: var(--accent-gold-soft); width: 3px; height: 3px; }
@keyframes emberRise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    8%   { opacity: 0.9; }
    70%  { opacity: 0.5; }
    100% { transform: translateY(-55vh) translateX(4vw); opacity: 0; }
}

.wrap {
    position: relative; z-index: 3;
    width: min(1640px, 97vw);
    margin: 0 auto;
    padding: 26px 0 40px;
}
.page-title {
    font-family: 'Press Start 2P', monospace;
    font-size: clamp(1rem, 2.6vw, 1.7rem);
    color: var(--accent-gold);
    text-align: center;
    text-shadow: var(--px) var(--px) 0 #3a2406, calc(var(--px)*2) calc(var(--px)*2) 0 rgba(0,0,0,0.6);
}
.page-title::before, .page-title::after { content: ' ◆ '; color: var(--accent-teal-dim); font-size: 0.8em; }
.page-sub {
    margin-top: 12px;
    text-align: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.58rem;
    color: var(--accent-teal);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
}

.teams-grid {
    margin-top: 30px;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 18px;
}
@media (max-width: 1280px) { .teams-grid { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 640px)  { .teams-grid { grid-template-columns: 1fr; } }

.team-card {
    position: relative;
    background: var(--bg-panel);
    border: 3px solid var(--accent-gold-deep);
    box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.5),
        var(--px) var(--px) 0 rgba(0,0,0,0.7);
}
.team-card.champ {
    border-color: var(--accent-gold);
    box-shadow:
        inset 0 0 0 2px rgba(0,0,0,0.5),
        var(--px) var(--px) 0 rgba(0,0,0,0.7),
        0 0 22px rgba(255,200,90,0.28);
}
.team-head {
    display: flex; align-items: center; justify-content: center;
    position: relative;
    padding: 14px 10px 12px;
    background: linear-gradient(rgba(20,50,58,0.9), rgba(10,28,34,0.4));
    border-bottom: 3px solid rgba(255,217,122,0.25);
}
.team-name {
    font-family: 'Press Start 2P', monospace;
    font-size: 0.72rem;
    color: var(--accent-cream);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.8);
    letter-spacing: 1px;
    text-align: center;
}
.team-card.mystery .team-name { color: var(--text-dim); }

.place-badge {
    position: absolute;
    top: -12px; right: -8px;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    padding: 6px 8px;
    background: var(--bg-stone);
    color: var(--accent-teal);
    border: 2px solid var(--accent-teal-dim);
    box-shadow: 2px 2px 0 rgba(0,0,0,0.7);
    transform: rotate(3deg);
    white-space: nowrap;
}
.place-badge.gold {
    background: var(--accent-gold-deep);
    color: #1b1206;
    border-color: var(--accent-gold);
    text-shadow: none;
}
.place-badge.extra {
    top: auto; bottom: -12px; right: 12px;
    transform: rotate(-2deg);
    background: #3a2406;
    color: var(--accent-gold);
    border-color: var(--accent-gold-deep);
}

.players { list-style: none; padding: 6px 0; }
.player {
    display: flex; align-items: center;
    gap: 10px;
    padding: 9px 14px;
    border-bottom: 2px solid rgba(141,245,234,0.07);
}
.player:last-child { border-bottom: none; }
.player:hover { background: rgba(255,217,122,0.06); box-shadow: inset 3px 0 0 var(--accent-gold-deep); }

.medal {
    position: relative;
    width: 42px;
    flex: 0 0 42px;
    display: flex; flex-direction: column; align-items: center;
}
.medal img {
    width: 40px; height: auto;
    image-rendering: auto;
    filter: drop-shadow(1px 2px 1px rgba(0,0,0,0.6));
}
.medal .rank-pill {
    margin-top: -9px;
    font-family: 'VT323', monospace;
    font-size: 14px;
    line-height: 1;
    padding: 1px 4px 2px;
    background: rgba(5,13,16,0.92);
    border: 1px solid var(--accent-gold-deep);
    color: var(--accent-gold);
    text-shadow: 1px 1px 0 rgba(0,0,0,0.8);
    white-space: nowrap;
    z-index: 1;
}

.flag {
    width: 22px; height: 15px;
    flex: 0 0 22px;
    object-fit: cover;
    border: 1px solid rgba(0,0,0,0.6);
    box-shadow: 1px 1px 0 rgba(0,0,0,0.6);
    image-rendering: pixelated;
}
.flag-unknown {
    width: 22px; height: 15px;
    flex: 0 0 22px;
    background: var(--bg-stone);
    border: 1px solid var(--accent-teal-dim);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Press Start 2P', monospace;
    font-size: 8px;
    color: var(--accent-teal-dim);
}

.p-name {
    flex: 1;
    font-size: 22px;
    letter-spacing: 0.5px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.p-name .crown { font-size: 16px; }
.team-card.mystery .p-name { color: var(--text-dim); letter-spacing: 2px; }

.p-mmr {
    font-family: 'VT323', monospace;
    font-size: 24px;
    font-weight: bold;
    color: var(--accent-gold);
    text-shadow: 2px 2px 0 rgba(0,0,0,0.75);
}
.p-mmr.na { color: var(--text-dim); }

.legend {
    margin-top: 26px;
    display: flex; justify-content: center; align-items: center;
    gap: 28px; flex-wrap: wrap;
}
.legend .item {
    display: flex; align-items: center; gap: 10px;
    background: var(--bg-stone);
    border: 3px solid var(--accent-gold-deep);
    box-shadow: inset 0 0 0 2px rgba(0,0,0,0.45), var(--px) var(--px) 0 rgba(0,0,0,0.7);
    padding: 8px 16px;
    font-family: 'Press Start 2P', monospace;
    font-size: 0.5rem;
    color: var(--accent-cream);
}
.legend .gem-mini {
    width: 12px; height: 12px;
    background: linear-gradient(135deg, var(--accent-gold), var(--accent-gold-deep));
    transform: rotate(45deg);
    border: 2px solid #3a2406;
}
.legend .mmr-tag { color: var(--accent-gold); }
</style>
</head>
<body>
<div class="bg-base"></div>
<div class="bg-vignette"></div>
<div class="scanlines"></div>

<div class="wrap">
    <h1 class="page-title">THE TEAMS</h1>
    <div class="page-sub" id="pageSub">8 NATIONS · 6 ROSTERS LOCKED · USA + GERMANY PICKS PENDING</div>
    <div class="teams-grid" id="grid"></div>
    <div class="legend">
        <div class="item"><img src="assets/ranking-medals/seasonal-rank-immortal.png" alt="" style="width:24px;height:auto;image-rendering:auto;"> DOTA2 RANK</div>
        <div class="item"><span class="mmr-tag">MMR</span> = AD MMR</div>
    </div>
</div>

<script>
// ---- DATA ----------------------------------------------------------------
// Fill TEAMS when rosters are known.
// player: [name, isoFlag|null, medal|null, rankPill|null, adMmr|null, crown?]
//   medal = filename suffix in assets/ranking-medals/seasonal-rank-<medal>.png
//           ('immortal', 'divine-3', 'legend-4', 'uncalibrated', ...); null = uncalibrated
//   rankPill = leaderboard rank shown under the medal, e.g. '#3147' (or 'PVT')
// place: e.g. '1ST','2ND','3RD','4TH','5-6TH','7-8TH' or null before results.
// extra: optional second badge e.g. '4X CHAMPIONS'. champ: gold border. crown: 👑 highest AD MMR.
// crown = captain (top-rated per country). Algeria mmrs are estimate-based -> shown as '—' (like last cup).
const TEAMS = [
    { name: 'RUSSIA', players: [
        ['lost~','ru','immortal','#890',4107,true],['hedgehog','ru','immortal',null,3670],
        ['Sandstorm','ru','immortal','#3815',3442],['FoXy','ru','divine-3',null,3432],
        ['shadle','ru','immortal','#680',3424]]},
    { name: 'USA', place: 'TBD', players: [
        [null,null,null,null,null],[null,null,null,null,null],[null,null,null,null,null],
        [null,null,null,null,null],[null,null,null,null,null]]},
    { name: 'KAZAKHSTAN', players: [
        ['Ptenchik','kz','immortal','#2568',3666,true],['Eurodance','kz','immortal','#2553',3471],
        ['Aniki','kz','immortal','#870',3334],['FantikJr','kz','legend-3',null,3196],
        ['Alexandr','kz','immortal','#1956',1642]]},
    { name: 'FINLAND', players: [
        ['noertti','fi','immortal','#2428',3666,true],['Ipelius','fi','immortal','#4974',3522],
        ['Spooner','fi','immortal','#3534',3308],['sifla','fi','immortal','#3136',3199],
        ['Kenny','fi','divine-5',null,3130]]},
    { name: 'GERMANY', place: 'TBD', players: [
        [null,null,null,null,null],[null,null,null,null,null],[null,null,null,null,null],
        [null,null,null,null,null],[null,null,null,null,null]]},
    { name: 'UKRAINE', players: [
        ['et si','ua','immortal','#4482',3975,true],['Silent Killer','ua','immortal',null,3446],
        ['John Cena','ua','immortal',null,3371],['slightly','ua','immortal','#3013',3295],
        ['ElnubresHomosyaches','ua','immortal',null,2438]]},
    { name: 'ALGERIA', players: [
        ['Shushu','dz','immortal','#236',null,true],['noobisho','dz','immortal','#456',null],
        ['HunTeR-','dz','immortal','#863',null],['paradox','dz','immortal','#817',null],
        ['Dashe_','dz','divine-5',null,2913]]},
    { name: 'UK', players: [
        ['K-1','gb','immortal',null,3261,true],['Rob Lobb','gb','immortal',null,3166],
        ['Lionheart','gb','immortal',null,2925],['bred','gb','immortal',null,2816],
        ['Grasswalker','gb','legend-1',null,2463]]},
];

// last year's results (extracted 1:1 from bloppppppp.github.io/rumbleV), ?demo=1 preview
const DEMO_TEAMS = [
    { name: 'TMNT', place: '1ST', champ: true, players: [
        ['Ptenchik','ru','immortal','#3147',3513],['Foxy','ru','divine-3',null,3383],
        ['Mirrored','dk','immortal',null,3680],['Lost','ru','immortal','#1562',3976],
        ['Lenske','rs','uncalibrated','PVT',3443]]},
    { name: 'SPACE MARINES', place: '2ND', players: [
        ['Space','us','immortal',null,3222],['friscy','us','immortal',null,3357],
        ['shushu','dz','immortal','#430',null],['Nano','lb','immortal','#648',null],
        ['Godba','pe','immortal','#4369',3606]]},
    { name: 'SEPPO13', place: '3RD', extra: '4X CHAMPIONS', players: [
        ['BigGoose','fi','immortal','#2953',2661],['noertti','fi','immortal','#2428',3707],
        ['sifla','fi','immortal','#1429',3087],['Fruugu','fi','immortal','#2381',2903],
        ['Juketsuu','fi','immortal','#4596',3288]]},
    { name: 'MASLYATA', place: '4TH', players: [
        ['sandstorm','ru','immortal','#3815',3509],['et si','ua','immortal',null,3996,true],
        ['hedgehog','ru','immortal',null,3741],['kid','ru','immortal',null,3518],
        ['piggy/electro','ua','immortal','#2024',3684]]},
    { name: 'LAY AN EGG', place: '5-6TH', players: [
        ['Dogical','us','immortal','#581',3062],['erik','us','immortal','#101',null],
        ['chrohny','us','immortal','#1367',null],['frisb','us','immortal','#480',3071],
        ['polo','us','immortal','#1628',2196]]},
    { name: 'SHOTGUN MARRIAGE', place: '5-6TH', players: [
        ['godwithashotgun','us','immortal','#3761',3263],['drea','de','immortal',null,3352],
        ['Admiral Rat','fi','divine-2',null,3209],['Silence','se','archon-4',null,3297],
        ['ATGAT','se','legend-4',null,2992]]},
    { name: 'GYM ESPORTS', place: '7-8TH', players: [
        ['Ultra Greed','kz','divine-4',null,3383],['Aniki','kz','immortal','#870',3337],
        ['Vata','sy','immortal','#932',2739],['Inffe','ru','immortal',null,3143],
        ['Hoshoryu','kz','immortal',null,3393]]},
    { name: 'LAGGAN', place: '7-8TH', players: [
        ['Circuz','se','divine-1',null,null],['Haj','se','immortal',null,2333],
        ['Hulk','se','guardian-2',null,2522],['Dr_McWho','gb','immortal','#4109',2941],
        ['Lungs','se','legend-4',null,2231]]},
];

// ---- RENDER ---------------------------------------------------------------
const demo = new URLSearchParams(location.search).has('demo');
const data = demo ? DEMO_TEAMS
    : (TEAMS.length ? TEAMS
    : Array.from({length: 8}, (_, i) => ({ name: 'TEAM ' + (i + 1), place: null, mystery: true,
        players: Array.from({length: 5}, () => [null, null, null, null, null]) })));

if (demo) document.getElementById('pageSub').textContent = 'DEMO MODE · 2025 RESULTS · LAYOUT PREVIEW';

const grid = document.getElementById('grid');
grid.innerHTML = data.map(team => `
    <div class="team-card${team.champ ? ' champ' : ''}${team.mystery ? ' mystery' : ''}">
        <div class="team-head">
            <div class="team-name">${team.name}</div>
            ${team.place ? `<div class="place-badge${team.place === '1ST' ? ' gold' : ''}">${team.place === '1ST' ? '🏆 ' : ''}${team.place}</div>` : ''}
            ${team.extra ? `<div class="place-badge extra">👑 ${team.extra}</div>` : ''}
        </div>
        <ul class="players">
            ${team.players.map(([name, iso, medal, pill, mmr, crown]) => `
            <li class="player">
                <div class="medal">
                    <img src="assets/ranking-medals/seasonal-rank-${medal ?? 'uncalibrated'}.png" alt="${medal ?? 'unranked'}">
                    ${pill ? `<span class="rank-pill">${pill}</span>` : ''}
                </div>
                ${iso ? `<img class="flag" src="https://flagcdn.com/w40/${iso}.png" alt="${iso}">`
                      : `<div class="flag-unknown">?</div>`}
                <div class="p-name">${name ?? '?????'}${crown ? ' <span class="crown">👑</span>' : ''}</div>
                <div class="p-mmr${mmr == null ? ' na' : ''}">${mmr ?? '—'}</div>
            </li>`).join('')}
        </ul>
    </div>`).join('');

// gold embers
for (let i = 0; i < 16; i++) {
    const e = document.createElement('div');
    e.className = 'ember';
    e.style.left = Math.random() * 100 + 'vw';
    e.style.top = 55 + Math.random() * 45 + 'vh';
    e.style.animationDuration = 6 + Math.random() * 9 + 's';
    e.style.animationDelay = Math.random() * 10 + 's';
    document.body.appendChild(e);
}
</script>
</body>
</html>
