<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AD World Cup 2026 — Versus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
:root{
  --gold-hi:#ffd97a; --gold:#e8a33d; --gold-deep:#b97c20;
  --teal:#8df5ea; --teal-dim:#2a6a66; --ink:#dceae6; --cream:#f4e4bc; --dim:#8fb0aa;
  --px:3px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--ink);}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);
  transform-origin:center center;background:#04070c;overflow:hidden;}

/* ================= SPLIT SCENE PANELS ================= */
.panel{position:absolute;inset:0;overflow:hidden;}
.panel.left{clip-path:polygon(0 0, 54.5% 0, 45.5% 100%, 0 100%);z-index:2;}
.panel.right{clip-path:polygon(54.5% 0, 100% 0, 100% 100%, 45.5% 100%);z-index:2;}
.panel video{position:absolute;top:50%;height:1140px;width:auto;transform:translateY(-50%);
  object-fit:cover;background:transparent;image-rendering:pixelated;}
/* darken toward the seam so the two scenes blend */
.panel .seamshade{position:absolute;inset:0;pointer-events:none;}
.panel.left  .seamshade{background:linear-gradient(100deg,transparent 62%,rgba(2,5,9,.78) 96%);}
.panel.right .seamshade{background:linear-gradient(260deg,transparent 62%,rgba(2,5,9,.78) 96%);}
/* entrance */
.panel.left {animation:slideL 1.1s cubic-bezier(.2,.85,.25,1) both;}
.panel.right{animation:slideR 1.1s cubic-bezier(.2,.85,.25,1) both;}
@keyframes slideL{0%{transform:translateX(-70px);opacity:0}100%{transform:translateX(0);opacity:1}}
@keyframes slideR{0%{transform:translateX(70px);opacity:0}100%{transform:translateX(0);opacity:1}}

/* glowing diagonal seam — angle MUST match the panel clip-path:
   clip edge runs 54.5% (top) -> 45.5% (bottom) = atan(0.09*1920/1080) = 9.08deg clockwise */
.seam{position:absolute;left:50%;top:50%;width:3px;height:1500px;z-index:6;pointer-events:none;
  transform:translate(-50%,-50%) rotate(9.08deg) translateZ(0);
  background:linear-gradient(to bottom,transparent 4%,rgba(232,179,90,.85) 30%,rgba(255,233,168,.95) 50%,rgba(232,179,90,.85) 70%,transparent 96%);
  box-shadow:0 0 22px 3px rgba(232,179,90,.45), 0 0 70px 14px rgba(232,179,90,.18);
  animation:seamPulse 5s ease-in-out infinite;}
@keyframes seamPulse{0%,100%{opacity:.8}50%{opacity:1}}

/* ================= CENTER VS ================= */
.center{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:560px;z-index:30;
  display:flex;align-items:center;justify-content:center;pointer-events:none;}
.vs-halo{position:absolute;width:560px;height:560px;border-radius:50%;
  background:radial-gradient(circle,rgba(4,7,12,.78) 0%,rgba(4,7,12,.35) 42%,transparent 68%);}
/* breathing glow as its own composited layer (opacity anim only — no filter anims, kills FPS) */
.vs-breathe{position:absolute;width:620px;height:430px;border-radius:50%;pointer-events:none;will-change:opacity;
  background:radial-gradient(ellipse,rgba(232,179,90,.34) 0%,rgba(216,120,40,.16) 45%,transparent 70%);
  animation:breatheOp 5s ease-in-out 1.5s infinite;opacity:0;}
@keyframes breatheOp{0%,100%{opacity:.35}50%{opacity:1}}
.vs{position:relative;font-family:'Press Start 2P',monospace;font-size:150px;line-height:1;
  color:var(--gold-hi);
  text-shadow:6px 6px 0 #3a2406, 12px 12px 0 rgba(0,0,0,.65), 0 0 40px rgba(255,170,60,.55);
  animation:vsIn .55s steps(4) .45s both;}
@keyframes vsIn{0%{opacity:0;transform:scale(2.1);filter:brightness(2.2)}100%{opacity:1;transform:scale(1);filter:none}}

/* ================= TITLE BAR (bottom, reference style) ================= */
.bottom-shade{position:absolute;left:0;right:0;bottom:0;height:420px;z-index:20;pointer-events:none;
  background:linear-gradient(to top,rgba(2,4,8,.96) 0%,rgba(2,4,8,.72) 38%,transparent 100%);}
.top-shade{position:absolute;left:0;right:0;top:0;height:170px;z-index:20;pointer-events:none;
  background:linear-gradient(to bottom,rgba(2,4,8,.8) 0%,transparent 100%);}

.titlebar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:35;text-align:center;width:1860px;}
.kicker{font-family:'Press Start 2P',monospace;font-size:19px;letter-spacing:6px;color:var(--teal);opacity:0;
  text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.8), 0 0 16px rgba(60,230,215,.6);
  animation:fadeUp .9s ease .7s forwards;}
/* country left — VS centered — country right */
.names-row{margin-top:18px;display:flex;align-items:center;width:100%;opacity:0;animation:fadeUp 1s ease .95s forwards;}
.names-row .cname{flex:1 1 0;font-family:'Press Start 2P',monospace;font-size:52px;line-height:1.15;letter-spacing:2px;white-space:nowrap;
  /* names hug the VS, like the divider lines below: left name ends just before it, right name starts just after */
  text-align:right;color:var(--gold-hi);
  text-shadow:4px 4px 0 #3a2406, 8px 8px 0 rgba(0,0,0,.6), 0 0 30px rgba(255,170,60,.45);}
.names-row .cname:last-child{text-align:left;}
.names-row .sep{flex:0 0 190px;font-family:'Press Start 2P',monospace;font-size:30px;text-align:center;opacity:.95;color:var(--gold);
  text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.75), 0 0 16px rgba(255,170,60,.4);}
.score-line{margin-top:12px;font-family:'VT323',monospace;font-size:44px;letter-spacing:10px;color:var(--cream);display:none;opacity:0;
  text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.85);animation:fadeUp 1s ease 1.25s forwards;}
@keyframes fadeUp{0%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:translateY(0)}}

/* ornate divider, like the reference */
.divider{margin:22px auto 0;width:1080px;height:26px;position:relative;opacity:0;animation:fadeUp 1s ease 1.15s forwards;}
.divider .line{position:absolute;top:50%;height:3px;width:470px;transform:translateY(-50%);
  background:linear-gradient(90deg,transparent,var(--gold-deep) 70%,var(--gold));}
.divider .line.l{left:0;}
.divider .line.r{right:0;transform:translateY(-50%) scaleX(-1);}
.divider .gem{position:absolute;left:50%;top:50%;width:16px;height:16px;transform:translate(-50%,-50%) rotate(45deg);
  background:var(--gold-hi);box-shadow:2px 2px 0 rgba(0,0,0,.7);}
.divider .gem::before,.divider .gem::after{content:'';position:absolute;width:8px;height:8px;background:var(--gold-deep);box-shadow:inherit;}
.divider .gem::before{left:-26px;top:5px;}
.divider .gem::after{right:-26px;top:5px;}

/* ================= EMBERS ================= */
.ember{position:absolute;width:4px;height:4px;border-radius:50%;z-index:25;opacity:0;pointer-events:none;
  animation:emberFloat linear infinite;}
@keyframes emberFloat{0%{transform:translate(0,0);opacity:0}8%{opacity:.85}55%{opacity:.55}
  100%{transform:translate(46px,-560px);opacity:0}}

/* ================= GRADE / GRAIN / VIGNETTE ================= */
.grade{position:absolute;inset:0;z-index:18;pointer-events:none;mix-blend-mode:soft-light;
  background:linear-gradient(180deg,rgba(20,60,70,.5),rgba(10,25,35,.3));}
.vignette{position:absolute;inset:0;z-index:50;pointer-events:none;
  background:radial-gradient(ellipse at 50% 44%,transparent 46%,rgba(0,0,0,.66) 100%);}
.scanlines{position:absolute;inset:0;z-index:52;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 4px);mix-blend-mode:multiply;}
.grain{position:absolute;inset:0;z-index:51;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ================= ROSTER PANELS ================= */
.roster{position:absolute;top:150px;width:352px;z-index:32;opacity:0;}
.roster.left{left:46px;animation:rosterL .9s cubic-bezier(.2,.85,.25,1) 1.35s forwards;}
.roster.right{right:46px;animation:rosterR .9s cubic-bezier(.2,.85,.25,1) 1.35s forwards;}
@keyframes rosterL{0%{opacity:0;transform:translateX(-46px)}100%{opacity:1;transform:translateX(0)}}
@keyframes rosterR{0%{opacity:0;transform:translateX(46px)}100%{opacity:1;transform:translateX(0)}}
.roster .rhead{padding:0 2px 9px;
  font-family:'Press Start 2P',monospace;font-size:14px;letter-spacing:2px;color:var(--cream);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);}
.roster .rbox{background:rgba(10,28,34,.88);border:3px solid var(--gold-deep);
  box-shadow:inset 0 0 0 2px rgba(0,0,0,.45), var(--px) var(--px) 0 rgba(0,0,0,.7);}
.rp{display:flex;align-items:center;gap:10px;padding:7px 12px;}
.rp+.rp{border-top:2px solid rgba(141,245,234,.07);}
.rp .rmedal{position:relative;flex:0 0 46px;width:46px;height:44px;}
.rp .rmedal img{width:44px;height:44px;object-fit:contain;display:block;margin:0 auto;image-rendering:auto;
  filter:drop-shadow(1px 1px 1px rgba(0,0,0,.6));}
.rp .rmedal .rpill{position:absolute;top:27px;left:50%;transform:translateX(-50%);z-index:1;
  font-family:'VT323',monospace;font-size:17px;line-height:1;padding:1px 4px 2px;
  background:rgba(5,13,16,.95);border:1px solid var(--gold-deep);color:var(--gold-hi);
  text-shadow:1px 1px 0 rgba(0,0,0,.9);white-space:nowrap;}
.rp .rname{flex:1;min-width:0;font-family:'VT323',monospace;font-size:27px;color:var(--ink);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 rgba(0,0,0,.7);}
.rp .rmmr{font-family:'VT323',monospace;font-weight:bold;font-size:29px;color:var(--gold-hi);
  text-shadow:2px 2px 0 rgba(0,0,0,.85);}
.rp .rmmr.na{color:var(--dim);}

/* picker */
#picker{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:10px;align-items:center;
  background:rgba(5,13,16,.94);border:3px solid var(--gold-deep);padding:9px 13px;
  font-family:'VT323',monospace;transition:opacity .4s;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45), var(--px) var(--px) 0 rgba(0,0,0,.7);}
#picker.hidden{opacity:0;pointer-events:none;}
#picker select{background:#0d2228;color:var(--ink);border:2px solid var(--gold-deep);padding:5px 8px;
  font-family:'VT323',monospace;font-size:18px;}
#picker .vs-mini{color:var(--gold-hi);font-family:'Press Start 2P',monospace;font-size:12px;}
#picker button{background:var(--gold-hi);color:#1b1206;border:2px solid var(--gold-deep);padding:5px 12px;font-weight:bold;font-family:'VT323',monospace;font-size:18px;cursor:pointer;}
#picker .hint{color:var(--dim);font-size:15px;margin-left:6px;max-width:260px;line-height:1.1;}
#pickerToggle{position:fixed;top:12px;right:14px;z-index:1000;width:38px;height:38px;cursor:pointer;
  background:rgba(5,13,16,.7);border:2px solid rgba(255,217,122,.35);color:rgba(255,217,122,.55);font-size:18px;
  transition:opacity .3s,color .3s,border-color .3s;opacity:.35;}
#pickerToggle:hover{opacity:1;}
#pickerToggle.active{opacity:1;color:var(--gold);border-color:var(--gold);box-shadow:0 0 12px rgba(232,179,90,.35);}

/* mobile: picker must fit the viewport (was overflowing both edges, left select unreachable) */
@media (max-width:760px){
  #picker{left:8px;right:60px;transform:none;flex-wrap:wrap;justify-content:center;gap:8px;padding:8px 10px;}
  #picker select{flex:1 1 100px;min-width:0;font-size:16px;} /* 16px stops iOS zoom-on-focus */
  #picker .hint{display:none;}
}
</style>
</head>
<body>
<div id="stage">
  <!-- split scenes (animated loops, poster = still image while loading) -->
  <div class="panel left"><video id="imgLeft" autoplay loop muted playsinline></video><div class="seamshade"></div></div>
  <div class="panel right"><video id="imgRight" autoplay loop muted playsinline></video><div class="seamshade"></div></div>
  <div class="seam"></div>

  <div class="grade"></div>
  <div class="top-shade"></div>
  <div class="bottom-shade"></div>

  <!-- center VS -->
  <div class="center"><div class="vs-halo"></div><div class="vs-breathe"></div><div class="vs">VS</div></div>

  <!-- bottom title -->
  <div class="titlebar">
    <div class="kicker" id="kicker">AD WORLD CUP 2026 · GROUP STAGE</div>
    <div class="names-row"><span class="cname" id="cnameL"></span><span class="sep">VS</span><span class="cname" id="cnameR"></span></div>
    <div class="divider"><div class="line l"></div><div class="gem"></div><div class="line r"></div></div>
    <div class="score-line" id="scoreLine"></div>
  </div>

  <!-- roster panels -->
  <div class="roster left" id="rosterL"></div>
  <div class="roster right" id="rosterR"></div>

  <div class="vignette"></div><div class="grain"></div><div class="scanlines"></div>
</div>

<button id="pickerToggle" title="Country selection">⚑</button>
<div id="picker" class="hidden">
  <select id="selL"></select><span class="vs-mini">VS</span><select id="selR"></select>
  <select id="selRound"></select>
  <button id="swapBtn">⇄</button>
  <span class="hint">?left=USA&amp;right=Germany&amp;round=Grand%20Final&amp;score=1-0&amp;roster=0&amp;clean=1</span>
</div>

<script>
// roster: [name, medal, leaderboardPill, adMmr] — first entry = captain (same data as index.html)
const NATIONS={
  Russia:{name:'Russia',poster:'v5_russia.png',loop:'loop_russia.mp4',seed:1,roster:[
    ['lost~','immortal','#890',4107],['hedgehog','immortal',null,3670],
    ['Sandstorm','immortal','#3815',3442],['FoXy','divine-3',null,3432],
    ['shadle','immortal','#680',3424]]},
  USA:{name:'USA',poster:'v4_usa.png',loop:'loop_usa.mp4',seed:2,roster:[
    ['DJ Dingus','immortal','#2064',3759],['Poof','immortal','#2875',3725],
    ['FriscyDriscy','immortal',null,3601],['Jynx','immortal','#1701',3483],
    ['erik','immortal','#933',3424]]},
  Kazakhstan:{name:'Kazakhstan',poster:'v4_kazakhstan.png',loop:'loop_kazakhstan.mp4',seed:3,roster:[
    ['Ptenchik','immortal','#2568',3666],['Eurodance','immortal','#2553',3471],
    ['Aniki','immortal','#870',3334],['FantikJr','legend-3',null,3196],
    ['Alexandr','immortal','#1956',1642]]},
  Finland:{name:'Finland',poster:'v5_finland.png',loop:'loop_finland.mp4',seed:4,roster:[
    ['noertti','immortal','#2428',3666],['Ipelius','immortal','#4974',3522],
    ['Spooner','immortal','#3534',3308],['sifla','immortal','#3136',3199],
    ['Kenny','divine-5',null,3130]]},
  Germany:{name:'Germany',poster:'v4_germany.png',loop:'loop_germany.mp4',seed:5,roster:[
    ['Mahaximus','immortal','#618',3886],['fish','immortal','#3610',3381],
    ['Drea','immortal',null,3375],['rob','immortal',null,3276],
    ['Mangology','immortal',null,3127]]},
  Ukraine:{name:'Ukraine',poster:'v4_ukraine.png',loop:'loop_ukraine.mp4',seed:6,roster:[
    ['et si','immortal','#4482',3975],['Silent Killer','immortal',null,3446],
    ['John Cena','immortal',null,3371],['slightly','immortal','#3013',3295],
    ['Elnubres','immortal',null,2438]]},
  Algeria:{name:'Algeria',poster:'v4_algeria.png',loop:'loop_algeria.mp4',seed:7,roster:[
    ['Shushu','immortal','#236',null],['noobisho','immortal','#456',null],
    ['HunTeR-','immortal','#863',null],['paradox','immortal','#817',null],
    ['Dashe_','divine-5',null,2913]]},
  UK:{name:'United Kingdom',poster:'v4_uk.png',loop:'loop_uk.mp4',seed:8,vh:1300,dy:-175,roster:[
    ['K-1','immortal',null,3261],['Rob Lobb','immortal',null,3166],
    ['Lionheart','immortal',null,2925],['bred','immortal',null,2816],
    ['Grasswalker','legend-1',null,2463]]}};
const ROUNDS=['Seeding Round','Upper Bracket Final','Lower Bracket Round 1','Lower Bracket Round 2','Lower Bracket Final','Grand Final'];
const ALIASES={'united kingdom':'UK','great britain':'UK','britain':'UK','england':'UK','gb':'UK','usa':'USA','america':'USA','united states':'USA','deutschland':'Germany','kazakstan':'Kazakhstan','suomi':'Finland','fi':'Finland'};
function resolveNation(k,fb){if(!k)return fb;const r=String(k).trim();if(NATIONS[r])return r;const l=r.toLowerCase();if(ALIASES[l])return ALIASES[l];return Object.keys(NATIONS).find(x=>x.toLowerCase()===l)||fb;}

// loop videos are 1280x720; scaled to `vh` tall (default 1140) -> ~2027 wide.
// place the (centered) fighter at 1/4 and 3/4 of the 1920 stage.
// per-nation vh/dy compensate source framing (e.g. UK fighter stands low -> shift up + zoom so no gap opens)
function placeVid(vid,side,nat){
  const vh=nat.vh||1140, dy=nat.dy||0;
  vid.style.height=vh+'px';
  vid.style.top='calc(50% + '+dy+'px)';
  vid.onloadedmetadata=()=>{
    const w=vid.videoWidth*(vh/vid.videoHeight);
    const cx= side==='left' ? 1920*0.25 : 1920*0.75;
    vid.style.left=(cx-w/2)+'px';
    vid.play().catch(()=>{});
  };
}
function buildSide(side,natKey){
  const vid=document.getElementById(side==='left'?'imgLeft':'imgRight');
  placeVid(vid,side,NATIONS[natKey]);
  vid.poster='sprites/'+NATIONS[natKey].poster;
  vid.src='sprites/'+NATIONS[natKey].loop;
}

const params=new URLSearchParams(location.search);
let leftKey=resolveNation(params.get('left'),'USA');
let rightKey=resolveNation(params.get('right'),'Germany');
let roundTxt=params.get('round')||'';
const scoreTxt=params.get('score'),clean=params.get('clean')==='1',showRoster=params.get('roster')!=='0';
function rosterHTML(key){
  const n=NATIONS[key];
  return '<div class="rhead">ROSTER</div><div class="rbox">'
    +n.roster.map(([name,medal,pill,mmr],i)=>
      '<div class="rp"><div class="rmedal"><img src="assets/ranking-medals/seasonal-rank-'+(medal||'uncalibrated')+'.png" alt="">'
      +(pill?'<span class="rpill">'+pill+'</span>':'')+'</div>'
      +'<div class="rname">'+name+'</div>'
      +'<div class="rmmr'+(mmr==null?' na':'')+'">'+(mmr==null?'—':mmr)+'</div></div>').join('')
    +'</div>';
}
function render(){
  buildSide('left',leftKey); buildSide('right',rightKey);
  document.getElementById('kicker').textContent='AD WORLD CUP 2026'+(roundTxt?' · '+roundTxt.toUpperCase():'');
  if(scoreTxt){const sl=document.getElementById('scoreLine');sl.style.display='block';sl.textContent=scoreTxt.replace(/-/g,' — ');}
  document.getElementById('rosterL').innerHTML=showRoster?rosterHTML(leftKey):'';
  document.getElementById('rosterR').innerHTML=showRoster?rosterHTML(rightKey):'';
  // one name per side, shrink each until it fits its half
  [['cnameL',leftKey],['cnameR',rightKey]].forEach(([id,key])=>{
    const el=document.getElementById(id);
    el.textContent=NATIONS[key].name.toUpperCase();
    let fs=52;el.style.fontSize=fs+'px';
    while(el.scrollWidth>800&&fs>26){fs-=2;el.style.fontSize=fs+'px';}
  });
  selL.value=leftKey; selR.value=rightKey; selRound.value=roundTxt;
}
const picker=document.getElementById('picker'),selL=document.getElementById('selL'),selR=document.getElementById('selR'),selRound=document.getElementById('selRound');
Object.keys(NATIONS).forEach(k=>{selL.add(new Option(NATIONS[k].name,k));selR.add(new Option(NATIONS[k].name,k));});
selRound.add(new Option('(no round)',''));
ROUNDS.forEach(r=>selRound.add(new Option(r,r)));
selL.onchange=()=>{leftKey=selL.value;render();};
selR.onchange=()=>{rightKey=selR.value;render();};
selRound.onchange=()=>{roundTxt=selRound.value;render();};
document.getElementById('swapBtn').onclick=()=>{[leftKey,rightKey]=[rightKey,leftKey];render();};
// explicit on/off toggle instead of mousemove auto-show
const toggle=document.getElementById('pickerToggle');
let pickerOn=false;
function setPicker(on){pickerOn=on;picker.classList.toggle('hidden',!on);toggle.classList.toggle('active',on);}
toggle.onclick=()=>setPicker(!pickerOn);
if(clean){picker.style.display='none';toggle.style.display='none';}else{setPicker(false);}
const stage=document.getElementById('stage');
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);stage.style.transform=`translate(-50%,-50%) scale(${s})`;}
addEventListener('resize',fit);fit();
// embers drifting up
(function(){for(let i=0;i<22;i++){const e=document.createElement('div');e.className='ember';
  e.style.left=(Math.random()*100)+'%';e.style.top=(60+Math.random()*40)+'%';
  const c=Math.random()<.7?'#e8a85a':'#ffd98a';e.style.background=c;e.style.boxShadow='0 0 8px '+c;
  e.style.animationDelay=(Math.random()*14)+'s';e.style.animationDuration=(11+Math.random()*9)+'s';
  stage.appendChild(e);}})();
render();
</script>
</body>
</html>
