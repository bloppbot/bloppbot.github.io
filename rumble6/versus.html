<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumble VI · Versus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<style>
@font-face{font-family:'VT323 Cyr';src:url('assets/fonts/pixelify-cyrillic.woff2') format('woff2');unicode-range:U+0400-04FF;}
:root{
  --accL:#6fe07a; --accR:#d42a2a;
  --green:#6fe07a; --green-deep:#2e6e3a; --cream:#f0e6d2; --ink:#e3ece4; --dim:#93a896; --red:#d42a2a;
  --px:3px;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%;height:100%;background:#000;overflow:hidden;color:var(--ink);}
#stage{position:absolute;top:50%;left:50%;width:1920px;height:1080px;transform:translate(-50%,-50%);transform-origin:center center;background:#030805;overflow:hidden;}
#shake{position:absolute;inset:0;}
.go #shake{animation:shake .45s steps(6) 1.02s both;}
@keyframes shake{0%{transform:translate(0,0)}20%{transform:translate(-9px,5px)}40%{transform:translate(8px,-6px)}60%{transform:translate(-6px,4px)}80%{transform:translate(4px,-2px)}100%{transform:translate(0,0)}}

/* ===== split scenes ===== */
.panel{position:absolute;inset:0;overflow:hidden;}
.panel.left{clip-path:polygon(0 0,54.5% 0,45.5% 100%,0 100%);z-index:2;}
.panel.right{clip-path:polygon(54.5% 0,100% 0,100% 100%,45.5% 100%);z-index:2;}
.panel video{position:absolute;top:50%;height:1080px;width:auto;transform:translateY(-50%);object-fit:cover;}
.panel .tint{position:absolute;inset:0;pointer-events:none;mix-blend-mode:soft-light;opacity:.55;}
.panel.left .tint{background:radial-gradient(ellipse at 25% 65%,var(--accL) 0%,transparent 60%);}
.panel.right .tint{background:radial-gradient(ellipse at 75% 65%,var(--accR) 0%,transparent 60%);}
.panel .seamshade{position:absolute;inset:0;pointer-events:none;}
.panel.left .seamshade{background:linear-gradient(100deg,transparent 62%,rgba(2,5,3,.8) 96%);}
.panel.right .seamshade{background:linear-gradient(260deg,transparent 62%,rgba(2,5,3,.8) 96%);}
.go .panel.left{animation:slideL 1s cubic-bezier(.2,.85,.25,1) both;}
.go .panel.right{animation:slideR 1s cubic-bezier(.2,.85,.25,1) both;}
@keyframes slideL{0%{transform:translateX(-120px);opacity:0}100%{transform:none;opacity:1}}
@keyframes slideR{0%{transform:translateX(120px);opacity:0}100%{transform:none;opacity:1}}

/* seam in both team colours; angle matches the clip edge (54.5% -> 45.5% = 9.08deg) */
.seam{position:absolute;left:50%;top:50%;width:4px;height:1500px;z-index:6;pointer-events:none;
  transform:translate(-50%,-50%) rotate(9.08deg) translateZ(0);
  background:linear-gradient(to bottom,transparent 3%,var(--accL) 26%,#fff 50%,var(--accR) 74%,transparent 97%);
  box-shadow:0 0 22px 3px rgba(255,255,255,.25),0 0 80px 16px rgba(255,255,255,.08);animation:seamPulse 4s ease-in-out infinite;}
@keyframes seamPulse{0%,100%{opacity:.75}50%{opacity:1}}
.go .seam{animation:seamIn .5s steps(5) .55s both,seamPulse 4s ease-in-out 1.1s infinite;}
@keyframes seamIn{0%{opacity:0;height:0}100%{opacity:1;height:1500px}}

/* ===== centre VS with impact ===== */
.center{position:absolute;top:0;bottom:0;left:50%;transform:translateX(-50%);width:600px;z-index:30;display:flex;align-items:center;justify-content:center;pointer-events:none;}
.vs-halo{position:absolute;width:600px;height:600px;border-radius:50%;background:radial-gradient(circle,rgba(3,8,5,.82) 0%,rgba(3,8,5,.38) 42%,transparent 68%);}
.vs-breathe{position:absolute;width:640px;height:440px;border-radius:50%;opacity:0;will-change:opacity;
  background:radial-gradient(ellipse,rgba(111,224,122,.3) 0%,rgba(212,42,42,.14) 45%,transparent 70%);animation:breathe 5s ease-in-out 1.6s infinite;}
@keyframes breathe{0%,100%{opacity:.35}50%{opacity:1}}
.vs{position:relative;font-family:'Press Start 2P',monospace;font-size:158px;line-height:1;color:var(--cream);
  text-shadow:7px 7px 0 #1a3b20,13px 13px 0 rgba(0,0,0,.65),0 0 44px rgba(111,224,122,.55);}
.vs .s{color:#ff5a4a;text-shadow:7px 7px 0 #3d0c0c,13px 13px 0 rgba(0,0,0,.65),0 0 44px rgba(212,42,42,.55);}
.go .vs{animation:vsIn .5s steps(4) .55s both;}
@keyframes vsIn{0%{opacity:0;transform:scale(2.4)}100%{opacity:1;transform:scale(1)}}
.ring{position:absolute;width:220px;height:220px;border-radius:50%;border:6px solid var(--cream);opacity:0;pointer-events:none;}
.go .ring{animation:ring .7s ease-out 1.02s both;}
.go .ring.r2{animation-delay:1.12s;border-color:#ff5a4a;}
@keyframes ring{0%{opacity:.9;transform:scale(.4)}100%{opacity:0;transform:scale(4.2);border-width:1px}}
.flash{position:absolute;inset:0;z-index:60;background:#fff;opacity:0;pointer-events:none;}
.go .flash{animation:flash .45s ease-out 1s both;}
@keyframes flash{0%{opacity:.55}100%{opacity:0}}

/* ===== shades / grade ===== */
.bottom-shade{position:absolute;left:0;right:0;bottom:0;height:440px;z-index:20;pointer-events:none;background:linear-gradient(to top,rgba(2,5,3,.97) 0%,rgba(2,5,3,.74) 38%,transparent 100%);}
.top-shade{position:absolute;left:0;right:0;top:0;height:180px;z-index:20;pointer-events:none;background:linear-gradient(to bottom,rgba(2,5,3,.82) 0%,transparent 100%);}
.vignette{position:absolute;inset:0;z-index:50;pointer-events:none;background:radial-gradient(ellipse at 50% 44%,transparent 46%,rgba(0,0,0,.68) 100%);}
.scanlines{position:absolute;inset:0;z-index:52;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 4px);mix-blend-mode:multiply;}
.grain{position:absolute;inset:0;z-index:51;pointer-events:none;opacity:.07;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");}

/* ===== title bar ===== */
.titlebar{position:absolute;left:50%;bottom:64px;transform:translateX(-50%);z-index:35;text-align:center;width:1500px;}
.kicker{font-family:'Press Start 2P',monospace;font-size:16px;letter-spacing:6px;color:var(--green);opacity:0;
  text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.85),0 0 16px rgba(111,224,122,.55);}
.kicker .bo{color:var(--cream);opacity:.75;}
.go .kicker{animation:fadeUp .8s ease .75s forwards;}
.names-row{margin-top:20px;display:flex;align-items:center;width:100%;opacity:0;}
.go .names-row{animation:fadeUp .9s ease 1.05s forwards;}
.side{flex:1 1 0;display:flex;align-items:center;gap:16px;min-width:0;}
.side.l{justify-content:flex-end;} .side.r{justify-content:flex-start;}
.tlogo{width:72px;height:72px;object-fit:contain;image-rendering:pixelated;filter:drop-shadow(4px 4px 0 rgba(0,0,0,.75));flex:0 0 auto;}
.tname{font-family:'Press Start 2P',monospace;font-size:42px;line-height:1.15;letter-spacing:2px;white-space:nowrap;}
.side.l .tname{color:var(--accL);text-align:right;text-shadow:4px 4px 0 rgba(0,0,0,.85),0 0 30px color-mix(in srgb,var(--accL) 45%,transparent);}
.side.r .tname{color:var(--accR);text-align:left;text-shadow:4px 4px 0 rgba(0,0,0,.85),0 0 30px color-mix(in srgb,var(--accR) 45%,transparent);}
.tseed{font-family:'Press Start 2P',monospace;font-size:13px;color:var(--cream);opacity:.7;margin-top:12px;letter-spacing:2px;}
.side.l .tseed{text-align:right;}
.names-row .sep{flex:0 0 120px;font-family:'Press Start 2P',monospace;font-size:28px;text-align:center;color:var(--cream);text-shadow:var(--px) var(--px) 0 rgba(0,0,0,.75);}
.score{flex:0 0 150px;font-family:'Press Start 2P',monospace;font-size:40px;text-align:center;color:var(--cream);text-shadow:4px 4px 0 rgba(0,0,0,.85);display:none;white-space:nowrap;}
.has-score .names-row .sep{display:none;} .has-score .score{display:block;}
/* series as fighting-game bars: one block per map you need, filled = maps won, team colour, pixel bevel; hidden without a score */
.hpbars{display:none;justify-content:center;align-items:center;margin:18px auto 0;opacity:0;}
.has-score .hpbars{display:flex;} .go .hpbars{animation:fadeUp .9s ease 1.25s forwards;}
.hpgap{flex:0 0 150px;}
.hp{display:flex;gap:6px;padding:5px;background:rgba(3,8,5,.85);border:3px solid #0d1a10;box-shadow:inset 0 0 0 2px rgba(240,230,210,.18),4px 4px 0 rgba(0,0,0,.65);}
.hp.l{flex-direction:row-reverse;--c:var(--accL);} .hp.r{--c:var(--accR);}
.hp .seg{width:96px;height:20px;background:rgba(255,255,255,.06);box-shadow:inset 0 -4px 0 rgba(0,0,0,.35);}
.hp .seg.on{background:var(--c);box-shadow:inset 0 4px 0 rgba(255,255,255,.35),inset 0 -5px 0 rgba(0,0,0,.35),0 0 16px color-mix(in srgb,var(--c) 60%,transparent);}
.hp .seg.on:last-of-type{animation:segPulse 1.6s ease-in-out 2.2s infinite;}
@keyframes segPulse{0%,100%{filter:brightness(1)}50%{filter:brightness(1.35)}}
.pips{display:flex;gap:9px;margin-top:14px;} .side.l .pips{justify-content:flex-end;}
.pip{width:14px;height:14px;border:2px solid currentColor;opacity:.45;transform:rotate(45deg);}
.pip.on{opacity:1;background:currentColor;box-shadow:0 0 14px currentColor;}
.side.l .pips{color:var(--accL);} .side.r .pips{color:var(--accR);}
@keyframes fadeUp{0%{opacity:0;transform:translateY(24px)}100%{opacity:1;transform:none}}

/* ===== rosters ===== */
.roster{position:absolute;top:140px;width:322px;z-index:32;opacity:0;}
.roster.left{left:34px;} .roster.right{right:34px;}
.go .roster.left{animation:rosterL .8s cubic-bezier(.2,.85,.25,1) 1.4s forwards;}
.go .roster.right{animation:rosterR .8s cubic-bezier(.2,.85,.25,1) 1.4s forwards;}
@keyframes rosterL{0%{opacity:0;transform:translateX(-50px)}100%{opacity:1;transform:none}}
@keyframes rosterR{0%{opacity:0;transform:translateX(50px)}100%{opacity:1;transform:none}}
.rhead{padding:0 2px 9px;font-family:'Press Start 2P',monospace;font-size:13px;letter-spacing:2px;color:var(--cream);text-shadow:2px 2px 0 rgba(0,0,0,.85);}
.roster.right .rhead{text-align:right;}
.rbox{background:rgba(3,8,5,.72);border:3px solid var(--acc);box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),var(--px) var(--px) 0 rgba(0,0,0,.7),0 0 26px color-mix(in srgb,var(--acc) 25%,transparent);}
.roster.left{--acc:var(--accL);} .roster.right{--acc:var(--accR);}
.rp{display:flex;align-items:center;gap:10px;padding:4px 12px;opacity:0;}
.go .rp{animation:fadeUp .45s ease forwards;}
.rp+.rp{border-top:2px solid rgba(111,224,122,.08);}
.rmedal{position:relative;flex:0 0 36px;width:36px;height:36px;}
.rmedal img{width:34px;height:34px;object-fit:contain;display:block;margin:0 auto;filter:drop-shadow(1px 1px 1px rgba(0,0,0,.6));}
.rpill{position:absolute;top:27px;left:50%;transform:translateX(-50%);font-family:'VT323',monospace;font-size:17px;line-height:1;padding:1px 4px 2px;background:rgba(3,8,5,.95);border:1px solid var(--green-deep);color:var(--green);white-space:nowrap;}
.rname{flex:1;min-width:0;display:flex;align-items:baseline;font-family:'VT323','VT323 Cyr',monospace;font-size:27px;color:var(--ink);text-shadow:2px 2px 0 rgba(0,0,0,.7);}
.rname .pn{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.rname .cpt{color:#ff5a4a;margin-left:5px;flex:0 0 auto;}
.rmmr{font-family:'VT323',monospace;font-weight:bold;font-size:29px;color:var(--green);text-shadow:2px 2px 0 rgba(0,0,0,.85);}
.rmmr.na{color:var(--dim);font-weight:normal;}
.rnew{font-family:'Press Start 2P',monospace;font-size:9px;color:var(--dim);border:1px solid #1b3521;padding:4px 5px;white-space:nowrap;}

/* ===== fireflies ===== */
.fly{position:absolute;width:4px;height:4px;border-radius:50%;z-index:25;opacity:0;pointer-events:none;animation:fly linear infinite;}
@keyframes fly{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(var(--dx),-280px);opacity:.5}90%{opacity:.8}100%{transform:translate(calc(var(--dx)*-.6),-560px);opacity:0}}

/* ===== picker ===== */
#picker{position:fixed;top:12px;left:50%;transform:translateX(-50%);z-index:999;display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center;max-width:96vw;
  background:rgba(3,8,5,.95);border:3px solid var(--green-deep);padding:9px 13px;font-family:'VT323',monospace;transition:opacity .3s;box-shadow:inset 0 0 0 2px rgba(0,0,0,.45),var(--px) var(--px) 0 rgba(0,0,0,.7);}
#picker.hidden{opacity:0;pointer-events:none;}
#picker select,#picker input{background:#0b1a0e;color:var(--ink);border:2px solid var(--green-deep);padding:5px 8px;font-family:'VT323','VT323 Cyr',monospace;font-size:18px;}
#picker input{width:70px;text-align:center;}
#picker .vs-mini{color:var(--green);font-family:'Press Start 2P',monospace;font-size:12px;}
#picker button{background:var(--green);color:#06140a;border:2px solid var(--green-deep);padding:5px 12px;font-weight:bold;font-family:'VT323',monospace;font-size:18px;cursor:pointer;}
#picker label{color:var(--dim);font-size:17px;display:flex;align-items:center;gap:4px;}
#picker .hint{color:var(--dim);font-size:15px;flex-basis:100%;text-align:center;}
#picker .hint code{color:var(--cream);}
#pickerToggle{position:fixed;top:12px;right:14px;z-index:1000;width:38px;height:38px;cursor:pointer;background:rgba(3,8,5,.7);border:2px solid rgba(111,224,122,.35);color:rgba(111,224,122,.6);font-size:18px;opacity:.35;transition:opacity .3s;}
#pickerToggle:hover,#pickerToggle.active{opacity:1;}
@media (max-width:760px){#picker{left:8px;right:60px;transform:none;}#picker select,#picker input{font-size:16px;}#picker .hint{display:none;}}
</style>
</head>
<body>
<div id="stage"><div id="shake">
  <div class="panel left"><video id="vidL" autoplay loop muted playsinline></video><div class="tint"></div><div class="seamshade"></div></div>
  <div class="panel right"><video id="vidR" autoplay loop muted playsinline></video><div class="tint"></div><div class="seamshade"></div></div>
  <div class="seam"></div>
  <div class="top-shade"></div><div class="bottom-shade"></div>
  <div class="center"><div class="vs-halo"></div><div class="vs-breathe"></div><div class="ring"></div><div class="ring r2"></div><div class="vs">V<span class="s">S</span></div></div>
  <div class="titlebar">
    <div class="kicker" id="kicker"></div>
    <div class="names-row">
      <div class="side l"><div><div class="tname" id="nameL"></div></div><img class="tlogo" id="logoL" alt=""></div>
      <span class="sep">VS</span><span class="score" id="score"></span>
      <div class="side r"><img class="tlogo" id="logoR" alt=""><div><div class="tname" id="nameR"></div></div></div>
    </div>
    <div class="hpbars" id="hpbars"><div class="hp l" id="hpL"></div><div class="hpgap"></div><div class="hp r" id="hpR"></div></div>
  </div>
  <div class="roster left" id="rosterL"></div>
  <div class="roster right" id="rosterR"></div>
</div>
<div class="flash"></div>
<div class="vignette"></div><div class="grain"></div><div class="scanlines"></div>
</div>

<button id="pickerToggle" title="Teams / round / score">&#9881;</button>
<div id="picker" class="hidden">
  <select id="selL"></select><span class="vs-mini">VS</span><select id="selR"></select>
  <button id="swapBtn" title="swap sides">&#8644;</button>
  <select id="selRound"></select>
  <label>Score <input id="inScore" placeholder="2-1"></label>
  <select id="selBo"><option value="">Bo auto</option><option value="1">Bo1</option><option value="3">Bo3</option><option value="5">Bo5</option></select>
  <label><input type="checkbox" id="chkRoster" checked> Roster</label>
  <button id="replayBtn" title="replay the intro (or press R)">&#9654; Intro</button>
  <span class="hint">OBS: <code id="urlHint"></code></span>
</div>

<script>
// team data generated from data/rumble6-teams.json by build_versus.py (same source as the teams section)
// roster: [name, medalIcon, leaderboardPill, adMmr(null = new to AD), steam32, captain, newToAd]

 ["Plupo", "immortal", "#1098", 3039, 81036058, false, false], ["PandaPGOD", "immortal", "#48", 2694, 164544758, false, false]]}, "spacemarines": {"name": "Space Marines", "seed": 6, "acc": "#3fd0c9", "logo": "assets/logos/spacemarines.png", "roster": [["Space Cowboy", "immortal", null, 3449, 153867895, true, false], ["Arnold", "immortal", "#3579", 3447, 110514740, false, false], ["Tkui", "ancient-4", null, 3119, 106989621, false, false], ["Vata", "immortal", "#957", 2639, 349472155, false, false], ["Other guy", "immortal", "#538", null, 113561132, false, true]]}, "dontpeek": {"name": "Don't Peek", "seed": 7, "acc": "#e8a33d", "logo": "assets/logos/dontpeek.png", "roster": [["BigGoose", "immortal", "#3859", 2856, 37777993, true, false], ["noertti", "immortal", "#2428", 3739, 54662003, false, false], ["sifla", "immortal", "#4841", 3244, 3292479, false, false], ["Fruugu", "immortal", "#4860", 2947, 56700331, false, false], ["balll", "immortal", "#2086", 2764, 158897083, false, false]]}, "oldravens": {"name": "Old Ravens", "seed": 8, "acc": "#e0334f", "logo": "assets/logos/oldravens.png", "roster": [["n0n1ck", "immortal", "#1344", 3549, 332561278, true, false], ["bwoha", "immortal", "#1721", 3244, 186287226, false, false], ["Oss", "immortal", "#1767", null, 963252025, false, true], ["yukidan", "immortal", "#4821", null, 259103381, false, true], ["lexmach", "immortal", "#4319", null, 160510334, false, true]]}, "mallards": {"name": "Mallards", "seed": 9, "acc": "#6fd060", "logo": "assets/logos/mallards.png", "roster": [["kitchen", null, null, 2842, 86724809, true, false], ["CCrush", null, null, 2769, 86732537, false, false], ["Sadpanda008", "legend-2", null, 2639, 37332980, false, false], ["thundertoss", "archon-4", null, 2423, 75048465, false, false], ["007shadow", "crusader-3", null, 2159, 89791306, false, false]]}, "hymer": {"name": "HYMER", "seed": 10, "acc": "#c86be0", "logo": "assets/logos/hymer_v2.png", "roster": [["толчонка", "legend-1", null, null, 1589402230, true, true], ["Marl", "legend-5", null, null, 1064090113, false, true], ["Srivelat", "ancient-2", null, null, 1093973531, false, true], ["korf", "archon-5", null, null, 975270769, false, true], ["famtomikss", "ancient-1", null, null, 1518775720, false, true]]}, "blondinok": {"name": "Playlist dlya blondinok", "seed": 11, "acc": "#e04040", "logo": "assets/logos/blondinok.png", "roster": [["Азизгул", null, null, 2015, 428156429, true, false], ["Boy next door", "archon-3", null, 2679, 109437833, false, false], ["Каспийский груз", null, null, 2310, 401159520, false, false], ["I feel so alive", "legend-2", null, 2249, 233511245, false, false], ["Kriamant", "archon-3", null, 1959, 917400483, false, false]]}};
const ROUNDS=['Qualifier','Group A','Group B','Upper Bracket Semi','Upper Bracket Final','Lower Bracket Round 1','Lower Bracket Quarter','Lower Bracket Semi','Lower Bracket Final','Grand Final'];
const BO_AUTO=r=>/group/i.test(r)?1:/grand/i.test(r)?5:r?3:0;
function resolveTeam(k,fb){if(!k)return fb;const l=String(k).trim().toLowerCase();if(TEAMS[l])return l;
  return Object.keys(TEAMS).find(x=>TEAMS[x].name.toLowerCase()===l||TEAMS[x].name.toLowerCase().replace(/[^a-z]/g,'')===l.replace(/[^a-z]/g,''))||fb;}
const params=new URLSearchParams(location.search);
const keys=Object.keys(TEAMS).sort((a,b)=>TEAMS[a].seed-TEAMS[b].seed);
let st={left:resolveTeam(params.get('left'),keys[0]),right:resolveTeam(params.get('right'),keys[1]),
  round:params.get('round')||'',score:params.get('score')||'',bo:params.get('bo')||'',roster:params.get('roster')!=='0'};
const clean=params.get('clean')==='1';
const $=id=>document.getElementById(id);

function placeVid(vid,side){
  vid.onloadedmetadata=()=>{const w=vid.videoWidth*(1080/vid.videoHeight);const cx=side==='left'?480:1440;vid.style.left=(cx-w/2)+'px';vid.play().catch(()=>{});};
}
function rosterHTML(t){
  return '<div class="rbox">'+t.roster.map(([n,medal,pill,mmr,sid,cpt],i)=>
    '<div class="rp" style="animation-delay:'+(1.5+i*.08).toFixed(2)+'s"><div class="rmedal"><img src="assets/ranking-medals/seasonal-rank-'+(medal||'uncalibrated')+'.png" alt="">'
    +'</div><div class="rname"><span class="pn">'+n+'</span>'+(cpt?'<span class="cpt">&#9733;</span>':'')+'</div>'
    +'<div class="rmmr'+(mmr==null?' na':'')+'">'+(mmr!=null?mmr:'&ndash;')+'</div>'+'</div>').join('')+'</div>';
}
function pips(el,wins,need){el.innerHTML=need>1?Array.from({length:need},(_,i)=>'<div class="pip'+(i<wins?' on':'')+'"></div>').join(''):'';}
function fitName(el){
  // one line down to 26px; longer names wrap onto two lines (max 330px wide) instead of becoming unreadable
  el.style.whiteSpace='nowrap';el.style.maxWidth='none';let fs=42;el.style.fontSize=fs+'px';
  while(el.scrollWidth>560&&fs>26){fs-=2;el.style.fontSize=fs+'px';}
  if(el.scrollWidth>560){el.style.whiteSpace='normal';el.style.maxWidth='560px';el.style.lineHeight='1.35';
    while((el.scrollWidth>560||el.offsetHeight>fs*1.35*2+4)&&fs>16){fs-=2;el.style.fontSize=fs+'px';}}
  else el.style.lineHeight='';
}
function setSide(side,key){
  const t=TEAMS[key],L=side==='left',vid=$(L?'vidL':'vidR');
  document.documentElement.style.setProperty(L?'--accL':'--accR',t.acc);
  placeVid(vid,side);
  vid.poster='assets/versus/hd/'+key+'.jpg';
  if(vid.dataset.key!==key){vid.dataset.key=key;vid.src='assets/versus/hd/'+key+'.mp4';}
  $(L?'nameL':'nameR').textContent=t.name.toUpperCase();fitName($(L?'nameL':'nameR'));
  const lg=$(L?'logoL':'logoR');lg.src=t.logo||'';lg.style.display=t.logo?'':'none';
  $(L?'rosterL':'rosterR').innerHTML=st.roster?rosterHTML(t):'';
}
function render(){
  setSide('left',st.left);setSide('right',st.right);
  const bo=+st.bo||BO_AUTO(st.round);
  $('kicker').innerHTML='RUMBLE VI'+(st.round?' &middot; '+st.round.toUpperCase():'');
  const m=/^\s*(\d+)\s*[-:]\s*(\d+)\s*$/.exec(st.score);
  $('stage').classList.toggle('has-score',!!m);
  $('score').textContent=m?m[1]+' - '+m[2]:'';
  const need=bo?Math.ceil(bo/2):0;
  const bar=(el,w)=>{el.innerHTML=Array.from({length:Math.max(need,1)},(_,i)=>'<div class="seg'+(i<w?' on':'')+'"></div>').join('');};
  bar($('hpL'),m?+m[1]:0);bar($('hpR'),m?+m[2]:0);
  selL.value=st.left;selR.value=st.right;selRound.value=st.round;inScore.value=st.score;selBo.value=st.bo;chkRoster.checked=st.roster;
  const q=new URLSearchParams({left:st.left,right:st.right});if(st.round)q.set('round',st.round);if(st.score)q.set('score',st.score);if(st.bo)q.set('bo',st.bo);if(!st.roster)q.set('roster','0');q.set('clean','1');
  $('urlHint').textContent=location.origin+location.pathname+'?'+q.toString();
  history.replaceState(null,'','?'+q.toString().replace('&clean=1','').replace('clean=1',''));
}
function replay(){const s=$('stage');s.classList.remove('go');void s.offsetWidth;s.classList.add('go');}
const selL=$('selL'),selR=$('selR'),selRound=$('selRound'),inScore=$('inScore'),selBo=$('selBo'),chkRoster=$('chkRoster');
keys.forEach(k=>{selL.add(new Option('#'+TEAMS[k].seed+' '+TEAMS[k].name,k));selR.add(new Option('#'+TEAMS[k].seed+' '+TEAMS[k].name,k));});
selRound.add(new Option('(no round)',''));ROUNDS.forEach(r=>selRound.add(new Option(r,r)));
selL.onchange=()=>{st.left=selL.value;render();replay();};
selR.onchange=()=>{st.right=selR.value;render();replay();};
selRound.onchange=()=>{st.round=selRound.value;render();};
inScore.oninput=()=>{st.score=inScore.value;render();};
selBo.onchange=()=>{st.bo=selBo.value;render();};
chkRoster.onchange=()=>{st.roster=chkRoster.checked;render();replay();};
$('swapBtn').onclick=()=>{[st.left,st.right]=[st.right,st.left];const m=/^(\d+)-(\d+)$/.exec(st.score);if(m)st.score=m[2]+'-'+m[1];render();replay();};
$('replayBtn').onclick=replay;
addEventListener('keydown',e=>{if((e.key==='r'||e.key==='R')&&document.activeElement.tagName!=='INPUT')replay();});
const toggle=$('pickerToggle');let on=false;
function setPicker(v){on=v;$('picker').classList.toggle('hidden',!v);toggle.classList.toggle('active',v);}
toggle.onclick=()=>setPicker(!on);
if(clean){$('picker').style.display='none';toggle.style.display='none';}
function fit(){const s=Math.min(innerWidth/1920,innerHeight/1080);$('stage').style.transform='translate(-50%,-50%) scale('+s+')';}
addEventListener('resize',fit);fit();
(function(){const sh=$('shake');for(let i=0;i<26;i++){const e=document.createElement('div');e.className='fly';
  e.style.left=(Math.random()*100)+'%';e.style.top=(55+Math.random()*45)+'%';e.style.setProperty('--dx',(Math.random()*120-60)+'px');
  const c=Math.random()<.65?'#9cf28f':'#ffb347';e.style.background=c;e.style.boxShadow='0 0 8px '+c;
  e.style.animationDelay=(Math.random()*14)+'s';e.style.animationDuration=(12+Math.random()*10)+'s';sh.appendChild(e);}})();
render();replay();
// names are fitted by measuring them: redo it once the pixel font has actually loaded (fallback font is narrower)
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{fitName($('nameL'));fitName($('nameR'));});
</script>
