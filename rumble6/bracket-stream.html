<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Rumble VI · Playoffs (Stream)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
<link rel="stylesheet" href="stream.css">
<style>
#bk{position:absolute;left:60px;right:60px;top:170px;bottom:70px;z-index:3;}
#bk svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}
.days{position:absolute;left:0;right:0;top:0;height:30px;font-family:'Press Start 2P',monospace;font-size:.62rem;color:var(--dim);letter-spacing:1px;}
.days span{position:absolute;top:0;transform:translateX(-50%);white-space:nowrap;}
.days b{color:var(--green);font-weight:normal;}
.lane{position:absolute;left:0;font-family:'Press Start 2P',monospace;font-size:.62rem;letter-spacing:2px;}
.lane.ub{top:48px;color:var(--green);}.lane.lb{top:430px;color:#ffc15e;}
.m{position:absolute;width:300px;background:rgba(11,23,18,.95);border:3px solid rgba(111,224,122,.3);box-shadow:3px 3px 0 rgba(0,0,0,.6);}
.m.lb{border-color:rgba(255,193,94,.32);}
.m.gf{border-color:#ffd97a;box-shadow:3px 3px 0 rgba(0,0,0,.6),0 0 26px rgba(255,217,122,.25);width:330px;}
.mh{display:flex;justify-content:space-between;padding:7px 10px 6px;font-family:'Press Start 2P',monospace;font-size:.5rem;color:var(--dim);letter-spacing:1px;background:rgba(0,0,0,.3);}
.mh b{color:var(--cream);font-weight:normal;}
.sl{display:flex;align-items:center;gap:10px;height:46px;padding:0 10px;border-top:2px solid rgba(111,224,122,.08);border-left:5px solid var(--a,transparent);}
.sl img{width:30px;height:30px;object-fit:contain;flex:0 0 30px;filter:drop-shadow(2px 2px 0 #000);}
.sl .nm{flex:1;font-family:'Press Start 2P',monospace;font-size:.58rem;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sl.tbd .nm{font-family:'VT323',monospace;font-size:1.35rem;color:var(--dim);}
.sl .sc{font-family:'Press Start 2P',monospace;font-size:.8rem;color:var(--dim);width:22px;text-align:right;}
.sl.won .nm,.sl.won .sc{color:var(--green);}
.sl.lost{opacity:.45;}
.m.live{outline:3px solid var(--red);}
.m.live .mh{background:rgba(168,22,22,.45);color:#ffd0d0;}
.m.next{outline:3px solid rgba(111,224,122,.55);}
.tag{font-family:'Press Start 2P',monospace;font-size:.5rem;padding:2px 5px;margin-left:8px;}
.m.live .tag{background:var(--red);color:#fff;animation:blink 1.2s steps(2) infinite;}
.m.next .tag{background:var(--green);color:#05140a;}
@keyframes blink{50%{opacity:.35}}
</style>
</head>
<body>
<div id="stage">
  <div class="vignette"></div><div class="scanlines"></div>
  <div class="head"><img src="assets/logo_wordmark.png" alt="Rumble in the Jungle"><div class="bar"></div><h1>PLAYOFFS</h1></div>
  <div id="bk"><svg id="lines"></svg>
    <div class="days"><span style="left:150px"><b>SUN OCT 18</b></span><span style="left:520px"><b>SUN OCT 18</b></span><span style="left:890px"><b>SAT OCT 24</b></span><span style="left:1260px"><b>SUN OCT 25</b></span><span style="left:1635px"><b>SUN OCT 25</b> · GRAND FINAL</span></div>
    <div class="lane ub">UPPER BRACKET</div><div class="lane lb">LOWER BRACKET</div>
    <div id="ms"></div>
  </div>
  <div class="note">double elimination &bull; best-of-three &bull; grand final best-of-five &bull; times CEST (Sun Oct 25: CET)</div>
</div>
<script src="stream.js"></script>
<script>
// card positions inside #bk (1800 x 840): x = column, y = top
const POS = { UBS1: [0, 80], UBS2: [0, 250], UBF: [740, 165], LBR1a: [0, 460], LBR1b: [0, 640], LBQ1: [370, 460], LBQ2: [370, 640],
  LBS: [740, 550], LBF: [1110, 550], GF: [1470, 330] };
const FLOW = [['UBS1', 'UBF'], ['UBS2', 'UBF'], ['LBR1a', 'LBQ1'], ['LBR1b', 'LBQ2'], ['LBQ1', 'LBS'], ['LBQ2', 'LBS'], ['LBS', 'LBF'], ['UBF', 'GF'], ['LBF', 'GF']];
R6.live(cfg => {
  const po = cfg.matches.filter(m => m.day > 1), now = cfg.now;
  const LM = R6.liveMap(po, now, cfg.matches);
  // teams not set yet: show each side as soon as its feeder series is decided (blopp 10-18)
  const FEED = { LBQ1: [['L', 'UBS1'], ['W', 'LBR1a']], LBQ2: [['L', 'UBS2'], ['W', 'LBR1b']], UBF: [['W', 'UBS1'], ['W', 'UBS2']],
      LBS: [['W', 'LBQ1'], ['W', 'LBQ2']], LBF: [['L', 'UBF'], ['W', 'LBS']], GF: [['W', 'UBF'], ['W', 'LBF']] }, MM = Object.fromEntries(cfg.matches.map(m => [m.id, m]));
  const pick = ([wl, f]) => { const r = MM[f] && MM[f].a && MM[f].result && MM[f].result.w; return r ? (wl === 'W' ? r : (r === MM[f].a ? MM[f].b : MM[f].a)) : null; };
  document.getElementById('ms').innerHTML = po.map(m => {
    const [x, y] = POS[m.id] || [0, 0], r = m.result || {}, w = r.w;
    const sc = (r.s || '').split(/[-:]/).map(Number).filter(n => !isNaN(n)), hi = Math.max(...sc, 0), lo = sc.length > 1 ? Math.min(...sc) : 0;
    const st = w ? '' : (LM[m.id] || '');
    const slot = (k, ph) => k
      ? `<div class="sl${w ? (w === k ? ' won' : ' lost') : ''}" style="--a:${R6.acc(k)}">${R6.logo(k, '')}<span class="nm">${R6.esc(R6.name(k).toUpperCase())}</span><span class="sc">${w ? (w === k ? hi : lo) : ''}</span></div>`
      : `<div class="sl tbd"><span class="nm">${R6.esc(ph)}</span></div>`;
    const cls = m.id === 'GF' ? 'gf' : m.id.startsWith('U') ? 'ub' : 'lb';
    return `<div class="m ${cls} ${st}" id="m-${m.id}" style="left:${x}px;top:${y}px"><div class="mh"><span><b>${m.stage}</b>${st ? `<span class="tag">${st === 'live' ? 'LIVE' : 'NEXT'}</span>` : ''}</span><span>${R6.time(m.at)} · BO${m.bo}</span></div>
      ${slot(m.a || (FEED[m.id] && pick(FEED[m.id][0])), m.slotA)}${slot(m.b || (FEED[m.id] && pick(FEED[m.id][1])), m.slotB)}</div>`;
  }).join('');
  // connectors: right edge of the feeder -> left edge of the target, pixel-step elbow
  const bk = document.getElementById('bk').getBoundingClientRect(), s = bk.width / 1800;
  const box = id => { const r = document.getElementById('m-' + id).getBoundingClientRect(); return { x0: (r.left - bk.left) / s, x1: (r.right - bk.left) / s, y: (r.top + r.height / 2 - bk.top) / s }; };
  document.getElementById('lines').setAttribute('viewBox', '0 0 1800 ' + bk.height / s);
  document.getElementById('lines').innerHTML = FLOW.map(([a, b]) => {
    const A = box(a), B = box(b), mx = Math.round((A.x1 + B.x0) / 2);
    const col = b === 'GF' ? '#ffd97a' : (a.startsWith('U') ? '#6fe07a' : '#ffc15e');
    return `<path d="M${A.x1} ${A.y}H${mx}V${B.y}H${B.x0}" fill="none" stroke="${col}" stroke-opacity=".45" stroke-width="3"/>`;
  }).join('');
});
</script>
</body>
</html>
